[package]
name = "clearing"
description = "Marginal clearing contract (filled in by E4-E6)"
version.workspace = true
edition.workspace = true
publish.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.22.0-rust-1.99.1"
image_digest = "sha256:c9655eaf7436b90c87ea8b25739f91063032c5c30ba24cfeafe72c142943b5bb"
passed_env = []
container_build_command = ["cargo", "near", "build", "non-reproducible-wasm", "--locked"]

[dependencies]
near-sdk.workspace = true
marginal-core = { path = "../../crates/marginal-core", default-features = false }

[dev-dependencies]
near-sdk = { workspace = true, features = ["unit-testing"] }
ed25519-dalek = "=2.2.0"
borsh.workspace = true
hex.workspace = true
serde_json.workspace = true
# The sandbox tests (tests/sandbox.rs): clearing and KeyPolicy as built wasm on a local chain.
near-workspaces = { version = "0.24", features = ["unstable"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
# The sandbox test drives the real KeyPolicy and attaches the fees it charges.
keypolicy = { path = "../keypolicy" }
