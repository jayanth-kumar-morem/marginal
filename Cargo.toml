[workspace]
resolver = "2"
members = [
  "crates/marginal-core",
  "contracts/clearing",
  "contracts/keypolicy",
  "contracts/test-tokens/musdc",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false
# Private until tasks.md X-2. Required by `cargo near build reproducible-wasm`.
repository = "https://github.com/jayanth-kumar-morem/marginal"

[workspace.dependencies]
near-sdk = "=5.30.1"
near-contract-standards = "=5.30.1"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
