[workspace]
resolver = "2"
members = [
  "crates/marginal-core",
  "crates/marginal-core-wasm",
  "contracts/clearing",
  "contracts/keypolicy",
  "contracts/test-tokens/musdc",
  "contracts/test-mocks/mocks",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false
# Private until tasks.md X-2. Required by `cargo near build reproducible-wasm`.
repository = "https://github.com/jayanth-kumar-morem/marginal"

[workspace.dependencies]
near-sdk = "=5.30.1"
near-contract-standards = "=5.30.1"
# marginal-core is no_std: these are used without `std` (they need only `alloc`). Versions are the
# ones near-sdk already resolves to.
borsh = { version = "=1.8.1", default-features = false, features = ["derive"] }
sha2 = { version = "=0.10.9", default-features = false }
hex = { version = "=0.4.3", default-features = false, features = ["alloc"] }
serde = { version = "=1.0.229", default-features = false, features = ["derive", "alloc"] }
serde_json = "=1.0.154"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

# Used only by `make cov-rust`. Release semantics (debug assertions off, so near-sdk's `require!`
# takes its real branch) without inlining or LTO, which would hide small functions from the report.
[profile.cov]
inherits = "release"
opt-level = 0
lto = false
codegen-units = 16
