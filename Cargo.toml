[workspace]
resolver = "2"
members = [
  "crates/marginal-core",
  "contracts/clearing",
  "contracts/keypolicy",
  "contracts/test-tokens/musdc",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

[workspace.dependencies]
near-sdk = { version = "=5.30.1", features = ["unstable"] }
near-contract-standards = "=5.30.1"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
