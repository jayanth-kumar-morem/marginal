name: ci
on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain (pinned by rust-toolchain.toml)
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install cargo-near
        run: cargo install cargo-near --version 0.23.0 --locked
      - run: make lint
      - run: make build
      - run: make test
      - name: Reproducible contract builds (docker)
        run: make wasm
      - name: Sandbox tests and deploy end-to-end
        run: make e2e
